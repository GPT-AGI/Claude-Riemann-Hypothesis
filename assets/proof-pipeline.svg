<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e1a33"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="url(#bg)"/>

  <!-- row 1: the statements -->
  <rect x="50" y="30" width="420" height="88" rx="10" fill="#0f1a30" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="260" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">Mathlib — pinned @ 0df444a</text>
  <text x="260" y="86" text-anchor="middle" font-size="12" fill="#94a3b8">def RiemannHypothesis : Prop — defined outside this repo,</text>
  <text x="260" y="104" text-anchor="middle" font-size="12" font-style="italic" fill="#94a3b8">so the headline statement is not home-rolled</text>

  <rect x="490" y="30" width="420" height="88" rx="10" fill="#0f1a30" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="700" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">src/Statements.lean — 16 lines</text>
  <text x="700" y="86" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#93c5fd">RiemannZetaZerosOnLine · DirichletLZerosOnLine</text>
  <text x="700" y="104" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#93c5fd">DirichletLNonvanishingRightOfHalf · PrimitiveDirichletLZerosOnLine</text>

  <line x1="260" y1="118" x2="260" y2="146" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="118" x2="700" y2="146" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- row 2: the proof body -->
  <rect x="50" y="148" width="860" height="150" rx="10" fill="#0f1a30" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="480" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#e2e8f0">The proof body — 9 libraries</text>
  <text x="480" y="204" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#93c5fd">Development (141,928 files) · Formalism (18,254) · GroundTheory (8,507)</text>
  <text x="480" y="224" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#93c5fd">ReciprocityTheory (3,845) · CompanionTheory (2,027) · PositivityTheory (449)</text>
  <text x="480" y="244" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#93c5fd">Lemmata (167) · Supplements (3) · BuildAid (5)</text>
  <text x="480" y="276" text-anchor="middle" font-size="12.5" fill="#34d399">175,187 files · 17,374,215 lines · 0 sorry · 0 admit · 0 custom axioms · 0 native_decide</text>

  <line x1="480" y1="298" x2="480" y2="324" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- row 3: the kernels -->
  <rect x="200" y="326" width="560" height="74" rx="10" fill="#0f1a30" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="358" text-anchor="middle" font-size="15" font-family="Consolas, monospace" fill="#e2e8f0">Supplements/Kernels/MainTheorems.lean</text>
  <text x="480" y="382" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#93c5fd">rhOfAll · allChi · critAll · claimAll</text>

  <line x1="480" y1="400" x2="480" y2="426" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- row 4: the main theorems -->
  <rect x="140" y="428" width="680" height="84" rx="10" fill="#0f1a30" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480" y="464" text-anchor="middle" font-size="16" font-family="Consolas, monospace" fill="#fbbf24">theorem riemannHypothesis : RiemannHypothesis := rhOfAll</text>
  <text x="480" y="490" text-anchor="middle" font-size="12" fill="#94a3b8">plus four GRH theorems for Dirichlet L-functions</text>

  <line x1="480" y1="512" x2="480" y2="538" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- row 5: the audit -->
  <rect x="140" y="540" width="680" height="74" rx="10" fill="#0f1a30" stroke="#34d399" stroke-width="1.5"/>
  <text x="480" y="572" text-anchor="middle" font-size="15" font-family="Consolas, monospace" fill="#a7f3d0">#print axioms riemannHypothesis</text>
  <text x="480" y="596" text-anchor="middle" font-size="12" fill="#94a3b8">expected: propext · Classical.choice · Quot.sound — and nothing else</text>
</svg>
